[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shockwave"
version = "0.1.0"
description = "Blast-radius regression & Jira triage for staging deploys (local engine + Obsidian integration)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["fastmcp>=2"]

[project.scripts]
shockwave = "shockwave.cli:main"
shockwave-mcp = "shockwave.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real Code Knowledge / git / Maven (needs VPN)"]
addopts = "-m 'not live'"

