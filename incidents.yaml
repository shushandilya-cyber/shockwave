  - id: INC-010
    jira: RAPTOR-42994
    priority: P2
    date: "2025-05-22"
    title: "polis fails to start after Spring Boot 3 SWU — NoClassDefFoundError in returnSvcV2Client"
    culprit_repo: CoreShipping/polis
    culprit_commit: "dbcb94f"
    culprit_branch: master
    victim_repos:
      - CoreShipping/polis
    victims_verified: true
    verification: >
      RAPTOR-42994 (P2 Bug) quotes PR #199 (dbcb94f, DELINS-565 P2 SWU, Raptor major upgrade) and the
      startup stack trace: BeanCreationException 'returnSvcV2Client' ← NoClassDefFoundError
      com/ebay/marketplace/returns/v3/services/request/UpdateReturnShippingCarrierRequest. Follow-up
      commits on master fix the dependency set: 7954341 (#200 remove DispositionCommonIO), 407edf5 (#201),
      aa8c7be (#202 remove hibernate), cb4034e (#204 fix metadata version). The ticket was closed as
      "Not an issue" (Jakarta variants were required for Spring Boot 3), but the app did not start.
    symptom: "Batch application failed at startup (bean creation) — pool could not be upgraded."
    expected_risk_class: BEHAVIORAL
    detection_time: "1 day"
    fix_commit: "cb4034e"
    catch_signals: ["sourceTestsFail"]
    notes: >
      A missing transitive class only shows up when the Spring context is built. Whether the
      source-repo suite boots the context decides whether this is catchable before deploy.
